<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6b3a">
  <meta name="color-scheme" content="light">
  <title>Pesagem</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <div class="topo-titulo">Pesagem</div>
    <div class="topo-acoes">
      <button class="btn btn-topo" data-acao="sincronizar" id="btn-sync">⟳ Sincronizar</button>
      <button class="btn btn-topo btn-icone" data-acao="abrir-config" aria-label="Configurações">⚙</button>
    </div>
  </header>
  <div id="faixa-sync" class="faixa"></div>
  <div id="faixa-envio" class="faixa faixa-envio"></div>
  <div id="faixa-atualizacao" class="faixa faixa-azul" hidden>
    Nova versão do app disponível.
    <button class="btn btn-pequeno" data-acao="atualizar-app">Atualizar agora</button>
  </div>

  <main id="tela"></main>

  <div id="modal" class="modal" hidden>
    <div class="modal-caixa">
      <div id="modal-texto" class="modal-texto"></div>
      <div class="modal-botoes">
        <button class="btn btn-grande btn-cinza" id="modal-nao">Cancelar</button>
        <button class="btn btn-grande btn-verde" id="modal-sim">OK</button>
      </div>
    </div>
  </div>
  <div id="aviso-rapido" class="aviso-rapido" hidden></div>

  <noscript>Este app precisa de JavaScript ativado.</noscript>
  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
