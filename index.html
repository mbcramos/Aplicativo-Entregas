<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6b3a">
  <meta name="color-scheme" content="light">
  <title>Pesagem</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <div class="topo-titulo">Pesagem</div>
    <div class="topo-data" id="topo-data" hidden></div>
    <div class="topo-acoes">
      <button class="status-sync" id="status-sync" data-acao="status" data-estado="ok" hidden></button>
      <button class="btn btn-topo" data-acao="sincronizar" id="btn-sync" aria-label="Sincronizar">⟳<span class="txt-sync"> Sincronizar</span></button>
    </div>
    <div class="bolhas">
      <div id="faixa-status" class="bolha" data-acao="fechar-status" hidden></div>
      <div id="faixa-atualizacao" class="bolha faixa-azul" hidden>
        <div>Nova versão do app disponível.</div>
        <button class="btn btn-pequeno" data-acao="atualizar-app">Atualizar agora</button>
      </div>
    </div>
  </header>

  <main id="tela"></main>

  <div id="modal" class="modal" hidden>
    <div class="modal-caixa">
      <div id="modal-texto" class="modal-texto"></div>
      <div class="modal-botoes">
        <button class="btn btn-grande btn-cinza" id="modal-nao">Cancelar</button>
        <button class="btn btn-grande btn-verde" id="modal-sim">OK</button>
      </div>
    </div>
  </div>
  <div id="modal-mot" class="modal" hidden>
    <div class="modal-caixa modal-mot">
      <div class="modal-titulo">Outro motorista</div>
      <div class="mm-digitar">
        <input id="mm-nome" class="entrada entrada-nome" type="text" autocomplete="off" autocapitalize="words"
          enterkeyhint="done" maxlength="40" placeholder="Digite o nome">
        <button class="btn btn-verde" data-acao="mm-usar">Usar</button>
      </div>
      <div id="mm-erro" class="mm-erro"></div>
      <div id="mm-rotulo" class="mm-rotulo">Ou escolha um motorista já usado:</div>
      <div id="mm-lista" class="motoristas mm-lista"></div>
      <button class="btn btn-grande btn-cinza" data-acao="mm-cancelar">Cancelar</button>
    </div>
  </div>
  <div id="aviso-rapido" class="aviso-rapido" hidden></div>

  <noscript>Este app precisa de JavaScript ativado.</noscript>
  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
